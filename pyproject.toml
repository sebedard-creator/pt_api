[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pt_api"
version = "1.3.8"
description = "API autonome pour manipuler les sessions Pro Tools (.ptx)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools]
py-modules = ["pt_api"]
